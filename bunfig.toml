telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "kitty-vt-wasm", "@stencil-hq/vibemon"]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# bun test does NOT honor .gitignore; prune robomp's repo clones and
# scratch dirs so a root-level `bun test` doesn't walk into them.
#
# `bazel-*` are Bazel's convenience symlinks, and `bazel-oh-my-pi` points at
# the workspace root itself: without this the scanner recurses through that
# loop, exhausts file descriptors, and every test that pipes a child process's
# stdio fails with empty output or EPIPE.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "docs/**",
  "runs/**",
  "python/robomp/data/**",
  ".wt/**",
  ".worktrees/**",
  "bazel-*/**",
  "**/bazel-out/**",
]

# Redirect PI_CODING_AGENT_DIR at a throwaway dir before any test module loads.
# Session tests pass a temp cwd but inherit the real agent dir, and the default
# session dir is created eagerly — so without this, every run litters the
# developer's own ~/.omp/agent/sessions. Must live under [test]: bun test
# ignores a top-level `preload`. Guarded by test/session-manager/agent-dir-isolation.test.ts.
preload = ["./packages/coding-agent/test/helpers/isolate-agent-dir.ts"]

[run]
bun = true
